<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дима и Костя едут по Екатеринбургу</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #050505;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
        }
        canvas {
            border: 4px solid #1a1a1a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 1200px;
            height: 675px;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }
        #weather-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 15, 0.85);
            color: #e0e0e0;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
            border: 1px solid #333;
            backdrop-filter: blur(4px);
        }
        #title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-size: 13px;
            background: rgba(10, 10, 15, 0.8);
            padding: 8px 14px;
            border-radius: 4px;
            letter-spacing: 1.5px;
            border-left: 3px solid #ff007f;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="gameCanvas" width="600" height="338"></canvas>
        <div id="weather-info">Загрузка данных...</div>
        <div id="title">ДИМА И КОСТЯ // IMPALA CONVERTIBLE '90s</div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const weatherDiv = document.getElementById('weather-info');
        
        ctx.imageSmoothingEnabled = false;
        
        let roadOffset = 0;
        let backgroundOffset = 0;
        const roadSpeed = 6;
        const backgroundSpeed = 1.5;
        
        let currentWeather = 'clear';
        let isNight = false;
        let temperature = 20;
        
        let trees = [];
        let houses = [];
        let clouds = [];
        
        function initBackground() {
            trees = [];
            houses = [];
            clouds = [];
            
            for (let i = 0; i < 30; i++) {
                trees.push({
                    x: Math.random() * 4000,
                    height: 50 + Math.random() * 50
                });
            }
            
            const houseColors = ['#2a2a35', '#3d312a', '#1e2830', '#352a35'];
            for (let i = 0; i < 20; i++) {
                houses.push({
                    x: Math.random() * 4000,
                    width: 60 + Math.random() * 50,
                    height: 50 + Math.random() * 70,
                    color: houseColors[Math.floor(Math.random() * houseColors.length)],
                    windows: Array.from({length: 12}, () => Math.random() > 0.4)
                });
            }
            
            for (let i = 0; i < 20; i++) {
                clouds.push({
                    x: Math.random() * 4000,
                    y: 10 + Math.random() * 50,
                    width: 40 + Math.random() * 60
                });
            }
        }
        
        async function getEkaterinburgWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.8389&longitude=60.6057&current=temperature_2m,weather_code,is_day,wind_speed_10m');
                const data = await response.json();
                
                temperature = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                isNight = data.current.is_day === 0;
                const windSpeed = data.current.wind_speed_10m;
                
                if (weatherCode <= 1) currentWeather = 'clear';
                else if (weatherCode <= 3) currentWeather = 'cloudy';
                else if (weatherCode <= 48) currentWeather = 'foggy';
                else if (weatherCode <= 67) currentWeather = 'rain';
                else if (weatherCode <= 77) currentWeather = 'snow';
                else currentWeather = 'rain';
                
                let weatherText = 'Ясно';
                let emoji = '☀️';
                if (currentWeather === 'cloudy') { weatherText = 'Облачно'; emoji = '☁️'; }
                else if (currentWeather === 'foggy') { weatherText = 'Туман'; emoji = '🌫️'; }
                else if (currentWeather === 'rain') { weatherText = 'Дождь'; emoji = '🌧️'; }
                else if (currentWeather === 'snow') { weatherText = 'Снег'; emoji = '❄️'; }
                
                const dayText = isNight ? '🌙 Ночь' : '☀️ День';
                weatherDiv.innerHTML = `${emoji} ЕКБ: ${temperature}°C | ${weatherText}<br>${dayText} | Ветер: ${windSpeed} м/с`;
            } catch (error) {
                weatherDiv.innerHTML = '🌙 ЕКБ: -2°C | Ночь<br>Облачно | Ветер: 4 м/с';
                isNight = true;
            }
        }
        
        // Отрисовка стилизованных аниме-персонажей по скетчу
        function drawAnimeCharacter(x, y, charType) {
            const p = 1.8; // масштаб спрайта
            
            // Костя (справа, с малиновыми волосами)
            if (charType === 'kostya') {
                // Пышные малиновые волосы (контур и пряди)
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(x - 22*p, y - 24*p, 44*p, 28*p);
                ctx.fillStyle = '#b30059';
                ctx.fillRect(x - 24*p, y - 18*p, 6*p, 22*p);
                ctx.fillRect(x + 18*p, y - 18*p, 6*p, 22*p);
                
                // Чёрные внутренние пряди
                ctx.fillStyle = '#111111';
                ctx.fillRect(x - 14*p, y - 20*p, 8*p, 10*p);
                ctx.fillRect(x + 6*p, y - 20*p, 8*p, 10*p);
                
                // Лицо
                ctx.fillStyle = '#ffe0bd';
                ctx.fillRect(x - 16*p, y - 10*p, 32*p, 24*p);
                
                // Челка с прядью посередине
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(x - 16*p, y - 12*p, 10*p, 8*p);
                ctx.fillRect(x + 6*p, y - 12*p, 10*p, 8*p);
                ctx.fillRect(x - 2*p, y - 10*p, 4*p, 12*p); // центральная прядь
                
                // Огромные аниме-глаза по скетчу
                // Левый глаз
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(x - 12*p, y - 2*p, 9*p, 12*p);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x - 10*p, y, 4*p, 8*p);
                ctx.fillRect(x - 11*p, y - 1*p, 3*p, 3*p); // верхний блик
                
                // Правый глаз
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(x + 3*p, y - 2*p, 9*p, 12*p);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 5*p, y, 4*p, 8*p);
                ctx.fillRect(x + 4*p, y - 1*p, 3*p, 3*p); // верхний блик

                // Улыбка / рот
                ctx.fillStyle = '#222222';
                ctx.fillRect(x - 3*p, y + 11*p, 6*p, 2*p);
            }
            
            // Дима (слева, тёмные колючие волосы)
            if (charType === 'dima') {
                // Колючие тёмные волосы
                ctx.fillStyle = '#211815';
                ctx.fillRect(x - 24*p, y - 26*p, 48*p, 30*p);
                
                // Тёмно-коричневые акценты/пряди
                ctx.fillStyle = '#4a352f';
                ctx.fillRect(x - 18*p, y - 22*p, 8*p, 8*p);
                ctx.fillRect(x + 10*p, y - 22*p, 8*p, 8*p);
                
                // Лицо
                ctx.fillStyle = '#f7d3b0';
                ctx.fillRect(x - 16*p, y - 10*p, 32*p, 24*p);
                
                // Колючая челка
                ctx.fillStyle = '#211815';
                ctx.fillRect(x - 18*p, y - 14*p, 8*p, 10*p);
                ctx.fillRect(x - 8*p, y - 12*p, 6*p, 8*p);
                ctx.fillRect(x + 2*p, y - 12*p, 6*p, 8*p);
                ctx.fillRect(x + 10*p, y - 14*p, 8*p, 10*p);
                
                // Огромные аниме-глаза
                // Левый глаз
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(x - 12*p, y - 2*p, 9*p, 12*p);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x - 10*p, y, 4*p, 8*p);
                ctx.fillStyle = '#4a352f';
                ctx.fillRect(x - 8*p, y + 3*p, 3*p, 4*p);
                
                // Правый глаз
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(x + 3*p, y - 2*p, 9*p, 12*p);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 5*p, y, 4*p, 8*p);
                ctx.fillStyle = '#4a352f';
                ctx.fillRect(x + 7*p, y + 3*p, 3*p, 4*p);

                // Спокойный рот
                ctx.fillStyle = '#222222';
                ctx.fillRect(x - 2*p, y + 11*p, 4*p, 2*p);
            }
        }
        
        // Отрисовка Impala '90s Convertible в 3/4 перспективе спереди
        function drawImpalaConvertible() {
            // Разметка дороги под капотом (движение вперед/вглубь)
            ctx.fillStyle = '#e6e6e6';
            for (let i = 0; i < 5; i++) {
                let pY = 180 + ((roadOffset + i * 45) % 160);
                let progress = (pY - 180) / 160;
                let w = 8 + progress * 24;
                let h = 4 + progress * 12;
                let pX = 300 - (progress * 120); // диагональный уход под капот
                
                ctx.fillRect(pX, pY, w, h);
            }

            // Салон и персонажи (без крыши!)
            // Задние сиденья / перегородка
            ctx.fillStyle = '#151518';
            ctx.fillRect(110, 100, 380, 50);
            
            // Персонажи сидят внутри
            drawAnimeCharacter(210, 115, 'dima');
            drawAnimeCharacter(390, 115, 'kostya');
            
            // Руль перед Костей
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(360, 135, 45, 6);
            ctx.fillRect(380, 130, 8, 15);
            
            // Тонкая рамка лобового стекла (кабриолет)
            ctx.fillStyle = '#3a3a42';
            ctx.fillRect(120, 128, 360, 4); // Верхняя планка
            ctx.fillRect(115, 128, 8, 40);  // Левая стойка
            ctx.fillRect(477, 128, 8, 40);  // Правая стойка
            
            // Полупрозрачное стекло
            ctx.fillStyle = 'rgba(120, 180, 220, 0.15)';
            ctx.beginPath();
            ctx.moveTo(123, 132);
            ctx.lineTo(477, 132);
            ctx.lineTo(510, 170);
            ctx.lineTo(90, 170);
            ctx.fill();

            // Огромный угловатый капот Импалы 90-х
            // Основной кузов (тёмно-фиолетовый / графитовый металлик)
            ctx.fillStyle = '#1c1b24';
            ctx.beginPath();
            ctx.moveTo(90, 170);
            ctx.lineTo(510, 170);
            ctx.lineTo(570, 270);
            ctx.lineTo(30, 270);
            ctx.fill();

            // Боковая линия капота (объем 3/4)
            ctx.fillStyle = '#121117';
            ctx.beginPath();
            ctx.moveTo(30, 270);
            ctx.lineTo(570, 270);
            ctx.lineTo(550, 310);
            ctx.lineTo(50, 310);
            ctx.fill();

            // Грани капота / выштамповка Impala SS
            ctx.fillStyle = '#282633';
            ctx.fillRect(140, 175, 320, 85);
            ctx.fillStyle = '#1c1b24';
            ctx.fillRect(150, 175, 300, 80);

            // Решетка радиатора спереди
            ctx.fillStyle = '#0a0a0d';
            ctx.fillRect(120, 275, 360, 25);
            ctx.fillStyle = '#444450';
            for (let g = 0; g < 12; g++) {
                ctx.fillRect(130 + g * 29, 277, 18, 21);
            }

            // Классические круглые двойные фары 90-х
            // Левая группа фар
            ctx.fillStyle = '#555560';
            ctx.fillRect(55, 273, 55, 28);
            ctx.fillStyle = '#fffae0';
            ctx.fillRect(60, 276, 20, 22);
            ctx.fillRect(85, 276, 20, 22);
            
            // Правая группа фар
            ctx.fillStyle = '#555560';
            ctx.fillRect(490, 273, 55, 28);
            ctx.fillStyle = '#fffae0';
            ctx.fillRect(495, 276, 20, 22);
            ctx.fillRect(520, 276, 20, 22);

            // Бампер с хромовой полосой
            ctx.fillStyle = '#2b2a36';
            ctx.fillRect(20, 305, 560, 18);
            ctx.fillStyle = '#787888';
            ctx.fillRect(40, 307, 520, 3); // Хром свечение

            // Колеса, видна резина снизу
            ctx.fillStyle = '#080808';
            ctx.fillRect(35, 315, 60, 23);
            ctx.fillRect(505, 315, 60, 23);
            
            // Зеркала заднего вида
            ctx.fillStyle = '#1c1b24';
            ctx.fillRect(85, 155, 25, 15);
            ctx.fillRect(490, 155, 25, 15);
        }
        
        function drawBackground() {
            // Небо
            if (isNight) {
                ctx.fillStyle = '#070714';
                ctx.fillRect(0, 0, canvas.width, 170);
                // Звёзды
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 40; i++) {
                    let sx = (i * 97) % canvas.width;
                    let sy = (i * 37) % 90;
                    ctx.fillRect(sx, sy, 1.5, 1.5);
                }
            } else {
                ctx.fillStyle = '#4a6984';
                ctx.fillRect(0, 0, canvas.width, 170);
            }
            
            // Облака
            clouds.forEach(cloud => {
                let cx = (cloud.x - backgroundOffset) % 4000;
                if (cx < -100) cx += 4000;
                if (cx < canvas.width + 100) {
                    ctx.fillStyle = isNight ? 'rgba(30,30,50,0.5)' : 'rgba(220,220,240,0.4)';
                    ctx.fillRect(cx, cloud.y, cloud.width, 12);
                }
            });
            
            // Силуэты домов ЕКБ на фоне
            houses.forEach(house => {
                let hx = (house.x - backgroundOffset) % 4000;
                if (hx < -150) hx += 4000;
                if (hx < canvas.width + 150) {
                    ctx.fillStyle = house.color;
                    ctx.fillRect(hx, 140 - house.height, house.width, house.height);
                    
                    // Окна
                    house.windows.forEach((lit, index) => {
                        if (lit && isNight) {
                            ctx.fillStyle = '#ffcc44';
                            let wx = hx + 8 + (index % 3) * 16;
                            let wy = 140 - house.height + 10 + Math.floor(index / 3) * 14;
                            ctx.fillRect(wx, wy, 6, 8);
                        }
                    });
                }
            });
            
            // Деревья
            trees.forEach(tree => {
                let tx = (tree.x - backgroundOffset) % 4000;
                if (tx < -80) tx += 4000;
                if (tx < canvas.width + 80) {
                    ctx.fillStyle = '#111a10';
                    ctx.fillRect(tx + 8, 140 - tree.height / 2, 6, tree.height / 2);
                    ctx.fillStyle = '#1a2e18';
                    ctx.fillRect(tx, 140 - tree.height, 22, tree.height / 2);
                }
            });

            // Дорожное полотно (база)
            ctx.fillStyle = '#1a1a20';
            ctx.fillRect(0, 140, canvas.width, 198);
        }
        
        function drawWeatherEffects() {
            if (currentWeather === 'rain') {
                ctx.fillStyle = 'rgba(140, 180, 255, 0.5)';
                for (let i = 0; i < 70; i++) {
                    let rx = (i * 41 + Date.now() / 4) % canvas.width;
                    let ry = (i * 29 + Date.now() / 2) % canvas.height;
                    ctx.fillRect(rx, ry, 1, 8);
                }
            }
            if (currentWeather === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                for (let i = 0; i < 50; i++) {
                    let sx = (i * 59 + Date.now() / 10) % canvas.width;
                    let sy = (i * 31 + Date.now() / 6) % canvas.height;
                    ctx.fillRect(sx, sy, 2, 2);
                }
            }
        }
        
        function animate() {
            roadOffset = (roadOffset + roadSpeed);
            backgroundOffset = (backgroundOffset + backgroundSpeed);
            
            drawBackground();
            drawImpalaConvertible();
            drawWeatherEffects();
            
            requestAnimationFrame(animate);
        }
        
        initBackground();
        getEkaterinburgWeather();
        setInterval(getEkaterinburgWeather, 300000);
        animate();
    </script>
</body>
</html>
