<!DOCTYPE html>
<html>
<head>
    <title>Дима и Костя едут по Екатеринбургу</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
        }
        canvas {
            border: 6px solid #2a2a2a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 1200px;
            height: 675px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        #weather-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 10;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
        }
        #title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="gameCanvas" width="600" height="338"></canvas>
        <div id="weather-info">Загружаем погоду Екатеринбурга...</div>
        <div id="title">ДИМА И КОСТЯ // ЕКАТЕРИНБУРГ</div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const weatherDiv = document.getElementById('weather-info');
        
        ctx.imageSmoothingEnabled = false;
        
        // Переменные для анимации
        let roadOffset = 0;
        let backgroundOffset = 0;
        const roadSpeed = 4;
        const backgroundSpeed = 2;
        
        // Погода и время (Екатеринбург: 56.8389, 60.6057)
        let currentWeather = 'clear';
        let isNight = false;
        let temperature = 20;
        
        // Фоновые объекты
        let trees = [];
        let bushes = [];
        let houses = [];
        let clouds = [];
        let streetlights = [];
        
        // Инициализация фоновых объектов с большим разнообразием
        function initBackground() {
            trees = [];
            bushes = [];
            houses = [];
            clouds = [];
            streetlights = [];
            
            // Разные деревья - ели, березы, клены, дубы
            for (let i = 0; i < 25; i++) {
                trees.push({
                    x: Math.random() * 3000,
                    type: Math.floor(Math.random() * 5), // 0-ель, 1-береза, 2-клен, 3-дуб, 4-сосна
                    height: 40 + Math.random() * 60,
                    season: Math.random()
                });
            }
            
            // Кусты - разные формы и размеры
            for (let i = 0; i < 30; i++) {
                bushes.push({
                    x: Math.random() * 3000,
                    type: Math.floor(Math.random() * 4),
                    width: 15 + Math.random() * 25,
                    height: 10 + Math.random() * 15
                });
            }
            
            // Дома - разные стили екатеринбургской архитектуры
            const houseStyles = [
                { color: '#8B7355', roof: '#654321' }, // конструктивизм
                { color: '#CD853F', roof: '#8B4513' }, // классика
                { color: '#A0522D', roof: '#3E2723' }, // деревянный
                { color: '#808080', roof: '#2C2C2C' }, // советский
                { color: '#BC8F8F', roof: '#5D4037' }, // модерн
            ];
            
            for (let i = 0; i < 15; i++) {
                const style = houseStyles[Math.floor(Math.random() * houseStyles.length)];
                houses.push({
                    x: Math.random() * 3000,
                    width: 50 + Math.random() * 40,
                    height: 40 + Math.random() * 50,
                    color: style.color,
                    roofColor: style.roof,
                    floors: 2 + Math.floor(Math.random() * 5),
                    windows: []
                });
                
                // Генерируем окна
                const house = houses[houses.length - 1];
                for (let floor = 0; floor < house.floors; floor++) {
                    for (let w = 0; w < Math.floor(house.width / 20); w++) {
                        house.windows.push({
                            x: w * 20 + 10,
                            y: floor * 15 + 10,
                            lit: Math.random() > 0.5
                        });
                    }
                }
            }
            
            // Облака
            for (let i = 0; i < 15; i++) {
                clouds.push({
                    x: Math.random() * 3000,
                    y: 10 + Math.random() * 60,
                    width: 30 + Math.random() * 40,
                    opacity: 0.3 + Math.random() * 0.5
                });
            }
            
            // Фонари
            for (let i = 0; i < 10; i++) {
                streetlights.push({
                    x: 200 + i * 300,
                    height: 50,
                    lit: Math.random() > 0.3
                });
            }
        }
        
        // Получение погоды Екатеринбурга
        async function getEkaterinburgWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.8389&longitude=60.6057&current=temperature_2m,weather_code,is_day,wind_speed_10m');
                const data = await response.json();
                
                temperature = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                isNight = data.current.is_day === 0;
                const windSpeed = data.current.wind_speed_10m;
                
                // Определяем погоду
                if (weatherCode <= 1) currentWeather = 'clear';
                else if (weatherCode <= 3) currentWeather = 'cloudy';
                else if (weatherCode <= 48) currentWeather = 'foggy';
                else if (weatherCode <= 67) currentWeather = 'rain';
                else if (weatherCode <= 77) currentWeather = 'snow';
                else currentWeather = 'rain';
                
                let weatherText = 'Ясно';
                let emoji = '☀️';
                if (currentWeather === 'cloudy') { weatherText = 'Облачно'; emoji = '☁️'; }
                else if (currentWeather === 'foggy') { weatherText = 'Туман'; emoji = '🌫️'; }
                else if (currentWeather === 'rain') { weatherText = 'Дождь'; emoji = '🌧️'; }
                else if (currentWeather === 'snow') { weatherText = 'Снег'; emoji = '❄️'; }
                
                const dayText = isNight ? '🌙 Ночь' : '☀️ День';
                weatherDiv.innerHTML = `${emoji} Екатеринбург: ${temperature}°C<br>${weatherText}, ${dayText}<br>💨 Ветер: ${windSpeed} м/с`;
            } catch (error) {
                weatherDiv.textContent = 'Екатеринбург: -5°C, Облачно';
            }
        }
        
        // Детализированное рисование персонажа
        function drawDetailedCharacter(x, y, character, scale = 2) {
            const p = scale;
            
            if (character === 'dima') {
                // Волосы - тёмно-русые с коричневыми прядями
                ctx.fillStyle = '#3B2F2F';
                ctx.fillRect(x + 2*p, y, 16*p, 5*p);
                ctx.fillRect(x + p, y + p, 3*p, 4*p);
                ctx.fillRect(x + 16*p, y + p, 3*p, 4*p);
                ctx.fillRect(x + 4*p, y - p, 4*p, p);
                
                // Коричневые пряди #8B6914
                ctx.fillStyle = '#8B6914';
                ctx.fillRect(x + 6*p, y, 3*p, 3*p);
                ctx.fillRect(x + 12*p, y + p, 2*p, 2*p);
                
                // Лицо - бледная кожа с деталями
                ctx.fillStyle = '#F5DEB3';
                ctx.fillRect(x + 2*p, y + 5*p, 16*p, 12*p);
                
                // Скулы
                ctx.fillStyle = '#E8D5B7';
                ctx.fillRect(x + 4*p, y + 12*p, 4*p, 2*p);
                ctx.fillRect(x + 12*p, y + 12*p, 4*p, 2*p);
                
                // Глаза - чёрно-коричневые #3B1F0B
                ctx.fillStyle = '#3B1F0B';
                ctx.fillRect(x + 5*p, y + 9*p, 3*p, 3*p);
                ctx.fillRect(x + 12*p, y + 9*p, 3*p, 3*p);
                
                // Белки глаз
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x + 5*p, y + 10*p, p, p);
                ctx.fillRect(x + 12*p, y + 10*p, p, p);
                
                // Брови
                ctx.fillStyle = '#2C1810';
                ctx.fillRect(x + 4*p, y + 7*p, 4*p, p);
                ctx.fillRect(x + 12*p, y + 7*p, 4*p, p);
                
                // Нос
                ctx.fillStyle = '#E8C9A0';
                ctx.fillRect(x + 9*p, y + 11*p, 2*p, 2*p);
                
                // Рот
                ctx.fillStyle = '#C4956A';
                ctx.fillRect(x + 8*p, y + 14*p, 4*p, p);
                
                // Чёрно-белая кофта с деталями
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x + 2*p, y + 17*p, 16*p, 10*p);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 2*p, y + 17*p, 8*p, 10*p);
                ctx.fillRect(x + 6*p, y + 20*p, 8*p, 2*p);
                ctx.fillRect(x + 9*p, y + 17*p, 2*p, 10*p);
                
                // Воротник
                ctx.fillStyle = '#333333';
                ctx.fillRect(x + 7*p, y + 16*p, 6*p, 2*p);
            }
            
            if (character === 'kostya') {
                // Волосы - ядерно-розовые с чёрными прядями
                ctx.fillStyle = '#FF1493';
                ctx.fillRect(x + 2*p, y, 16*p, 5*p);
                ctx.fillRect(x + p, y + p, 3*p, 4*p);
                ctx.fillRect(x + 16*p, y + p, 3*p, 4*p);
                ctx.fillRect(x + 5*p, y - p, 5*p, p);
                
                // Чёрные пряди
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 3*p, y + p, 4*p, 3*p);
                ctx.fillRect(x + 13*p, y, 3*p, 4*p);
                ctx.fillRect(x + 8*p, y - p, 4*p, p);
                
                // Лицо - бледная кожа
                ctx.fillStyle = '#F5DEB3';
                ctx.fillRect(x + 2*p, y + 5*p, 16*p, 12*p);
                
                // Солнцезащитные очки - стильные
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(x + 3*p, y + 8*p, 14*p, 4*p);
                ctx.fillRect(x + 4*p, y + 8*p, 5*p, 3*p); // левая линза
                ctx.fillRect(x + 11*p, y + 8*p, 5*p, 3*p); // правая линза
                
                // Отражение на очках
                ctx.fillStyle = '#444444';
                ctx.fillRect(x + 5*p, y + 9*p, 2*p, p);
                ctx.fillRect(x + 12*p, y + 9*p, 2*p, p);
                
                // Дужки очков
                ctx.fillStyle = '#333333';
                ctx.fillRect(x + p, y + 9*p, 2*p, p);
                ctx.fillRect(x + 17*p, y + 9*p, 2*p, p);
                
                // Рубашка с деталями
                ctx.fillStyle = '#4169E1';
                ctx.fillRect(x + 2*p, y + 17*p, 16*p, 10*p);
                
                // Воротник рубашки
                ctx.fillStyle = '#2E4FA0';
                ctx.fillRect(x + 5*p, y + 16*p, 10*p, 2*p);
                
                // Пуговицы
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x + 9*p, y + 19*p, 2*p, 2*p);
                ctx.fillRect(x + 9*p, y + 22*p, 2*p, 2*p);
                ctx.fillRect(x + 9*p, y + 25*p, 2*p, 2*p);
                
                // Руки на руле
                ctx.fillStyle = '#F5DEB3';
                ctx.fillRect(x + 3*p, y + 18*p, 3*p, 6*p);
                ctx.fillRect(x + 14*p, y + 18*p, 3*p, 6*p);
            }
        }
        
        // Детализированная машина - вид сбоку, крупно
        function drawLuxuryCar(x, y) {
            const p = 1; // масштаб
            
            // Нижняя часть кузова
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(x + 30, y + 70, 340, 60);
            
            // Верхняя часть кузова
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(x + 50, y + 30, 300, 50);
            
            // Капот
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(x + 20, y + 65, 30, 55);
            
            // Багажник
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(x + 350, y + 65, 50, 55);
            
            // Лобовое стекло
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(x + 70, y + 35, 40, 35);
            
            // Заднее стекло
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(x + 290, y + 35, 40, 35);
            
            // Боковые окна
            ctx.fillStyle = '#A8D8EA';
            ctx.fillRect(x + 110, y + 35, 60, 30); // переднее
            ctx.fillRect(x + 230, y + 35, 60, 30); // заднее
            
            // Рамы окон
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(x + 105, y + 33, 5, 34);
            ctx.fillRect(x + 170, y + 33, 5, 34);
            ctx.fillRect(x + 225, y + 33, 5, 34);
            ctx.fillRect(x + 290, y + 33, 5, 34);
            
            // Фары
            ctx.fillStyle = '#FFE57F';
            ctx.fillRect(x + 15, y + 70, 15, 20);
            ctx.fillStyle = '#FFF9C4';
            ctx.fillRect(x + 18, y + 75, 8, 10);
            
            // Задние фонари
            ctx.fillStyle = '#FF1744';
            ctx.fillRect(x + 370, y + 70, 15, 20);
            
            // Зеркала
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(x + 65, y + 38, 8, 15);
            ctx.fillRect(x + 327, y + 38, 8, 15);
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(x + 63, y + 40, 4, 10);
            ctx.fillRect(x + 333, y + 40, 4, 10);
            
            // Дверные ручки
            ctx.fillStyle = '#808080';
            ctx.fillRect(x + 130, y + 55, 10, 3);
            ctx.fillRect(x + 260, y + 55, 10, 3);
            
            // Колёса
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x + 50, y + 110, 40, 40);
            ctx.fillRect(x + 310, y + 110, 40, 40);
            
            // Диски
            ctx.fillStyle = '#808080';
            ctx.fillRect(x + 60, y + 120, 20, 20);
            ctx.fillRect(x + 320, y + 120, 20, 20);
            ctx.fillStyle = '#A9A9A9';
            ctx.fillRect(x + 65, y + 125, 10, 10);
            ctx.fillRect(x + 325, y + 125, 10, 10);
            
            // Руль
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x + 120, y + 50, 20, 3);
            ctx.fillRect(x + 128, y + 45, 4, 13);
            
            // Приборная панель
            ctx.fillStyle = '#2C2C2C';
            ctx.fillRect(x + 100, y + 60, 40, 5);
        }
        
        // Рисование фона с деталями
        function drawBackground() {
            // Небо
            if (isNight) {
                ctx.fillStyle = '#0a0a2e';
                // Звёзды
                for (let i = 0; i < 50; i++) {
                    const starX = (i * 137 + 50) % canvas.width;
                    const starY = (i * 89 + 20) % 100;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(starX, starY, 2, 2);
                }
            } else if (currentWeather === 'cloudy' || currentWeather === 'rain') {
                ctx.fillStyle = '#6B6B6B';
            } else if (currentWeather === 'foggy') {
                ctx.fillStyle = '#9E9E9E';
            } else {
                ctx.fillStyle = '#64B5F6';
                // Солнце
                ctx.fillStyle = '#FFD54F';
                ctx.fillRect(50, 30, 40, 40);
                ctx.fillStyle = '#FFE082';
                ctx.fillRect(45, 25, 50, 50);
                ctx.fillStyle = '#FFF9C4';
                ctx.fillRect(40, 20, 60, 60);
            }
            
            // Облака
            if (!isNight && currentWeather !== 'rain') {
                clouds.forEach(cloud => {
                    const cloudX = cloud.x - backgroundOffset;
                    if (cloudX > -100 && cloudX < canvas.width + 100) {
                        ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
                        ctx.fillRect(cloudX, cloud.y, cloud.width, 15);
                        ctx.fillRect(cloudX + 10, cloud.y - 8, cloud.width - 20, 8);
                        ctx.fillRect(cloudX + 20, cloud.y - 15, cloud.width - 40, 7);
                    }
                });
            }
            
            // Дома с окнами
            houses.forEach(house => {
                const houseX = house.x - backgroundOffset;
                if (houseX > -150 && houseX < canvas.width + 150) {
                    // Здание
                    ctx.fillStyle = house.color;
                    ctx.fillRect(houseX, 130 - house.height, house.width, house.height);
                    
                    // Крыша
                    ctx.fillStyle = house.roofColor;
                    ctx.fillRect(houseX - 5, 130 - house.height - 10, house.width + 10, 10);
                    
                    // Окна
                    house.windows.forEach(window => {
                        const windowX = houseX + window.x;
                        const windowY = 130 - house.height + window.y;
                        if (windowY > 20 && windowY < 130) {
                            if (window.lit && isNight) {
                                ctx.fillStyle = '#FFD54F';
                            } else if (isNight) {
                                ctx.fillStyle = '#1a1a1a';
                            } else {
                                ctx.fillStyle = '#87CEEB';
                            }
                            ctx.fillRect(windowX, windowY, 8, 10);
                            ctx.fillStyle = '#333';
                            ctx.fillRect(windowX + 3, windowY, 2, 10);
                        }
                    });
                }
            });
            
            // Деревья - разные типы
            trees.forEach(tree => {
                const treeX = tree.x - backgroundOffset;
                if (treeX > -80 && treeX < canvas.width + 80) {
                    const baseY = 130;
                    const height = tree.height;
                    
                    if (tree.type === 0) {
                        // Ель
                        ctx.fillStyle = '#5D4037';
                        ctx.fillRect(treeX + 10, baseY - height/2, 10, height/2);
                        ctx.fillStyle = '#1B5E20';
                        ctx.fillRect(treeX, baseY - height, 20, height/2);
                        ctx.fillRect(treeX + 5, baseY - height - 10, 10, 10);
                        ctx.fillRect(treeX + 3, baseY - height + 15, 14, height/3);
                    } else if (tree.type === 1) {
                        // Берёза
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(treeX + 10, baseY - height + 20, 10, height - 20);
                        ctx.fillStyle = '#000000';
                        ctx.fillRect(treeX + 12, baseY - height + 30, 2, 10);
                        ctx.fillRect(treeX + 15, baseY - height + 50, 2, 15);
                        ctx.fillStyle = '#4CAF50';
                        ctx.fillRect(treeX, baseY - height, 30, 20);
                        ctx.fillRect(treeX + 5, baseY - height - 10, 20, 10);
                    } else if (tree.type === 2) {
                        // Клён
                        ctx.fillStyle = '#795548';
                        ctx.fillRect(treeX + 10, baseY - height + 30, 10, height - 30);
                        ctx.fillStyle = '#FF6F00';
                        ctx.fillRect(treeX, baseY - height, 25, 25);
                        ctx.fillRect(treeX + 5, baseY - height - 5, 15, 30);
                    } else if (tree.type === 3) {
                        // Дуб
                        ctx.fillStyle = '#5D4037';
                        ctx.fillRect(treeX + 10, baseY - height + 25, 15, height - 25);
                        ctx.fillStyle = '#33691E';
                        ctx.fillRect(treeX - 5, baseY - height, 35, 30);
                        ctx.fillRect(treeX, baseY - height - 10, 25, 10);
                    } else {
                        // Сосна
                        ctx.fillStyle = '#4E342E';
                        ctx.fillRect(treeX + 10, baseY - height/2, 8, height/2);
                        ctx.fillStyle = '#2E7D32';
                        ctx.fillRect(treeX + 2, baseY - height, 24, 15);
                        ctx.fillRect(treeX + 5, baseY - height - 8, 18, 8);
                    }
                }
            });
            
            // Кусты
            bushes.forEach(bush => {
                const bushX = bush.x - backgroundOffset;
                if (bushX > -40 && bushX < canvas.width + 40) {
                    ctx.fillStyle = bush.type === 0 ? '#2E7D32' : bush.type === 1 ? '#388E3C' : '#4CAF50';
                    ctx.fillRect(bushX, 125, bush.width, bush.height);
                    ctx.fillRect(bushX + 3, 120, bush.width - 6, bush.height - 3);
                    ctx.fillRect(bushX + 6, 118, bush.width - 12, 4);
                }
            });
            
            // Фонари
            streetlights.forEach(light => {
                const lightX = light.x - backgroundOffset;
                if (lightX > -20 && lightX < canvas.width + 20) {
                    ctx.fillStyle = '#424242';
                    ctx.fillRect(lightX, 80, 3, 50);
                    ctx.fillRect(lightX - 5, 80, 13, 3);
                    if (light.lit || isNight) {
                        ctx.fillStyle = '#FFE082';
                        ctx.fillRect(lightX - 2, 83, 7, 4);
                    }
                }
            });
            
            // Земля
            ctx.fillStyle = '#8BC34A';
            ctx.fillRect(0, 130, canvas.width, 10);
        }
        
        // Рисование дороги
        function drawRoad() {
            // Дорога
            ctx.fillStyle = '#424242';
            ctx.fillRect(0, 140, canvas.width, 198);
            
            // Разметка (движется)
            ctx.fillStyle = '#FAFAFA';
            for (let i = -1; i < 12; i++) {
                const markingX = (i * 80) - roadOffset;
                if (markingX > -80 && markingX < canvas.width + 80) {
                    ctx.fillRect(markingX, 235, 40, 6);
                }
            }
            
            // Бордюры
            ctx.fillStyle = '#757575';
            ctx.fillRect(0, 138, canvas.width, 2);
            ctx.fillRect(0, 336, canvas.width, 2);
            
            // Тротуар
            ctx.fillStyle = '#9E9E9E';
            ctx.fillRect(0, 130, canvas.width, 8);
            ctx.fillRect(0, 338, canvas.width, 8);
        }
        
        // Погодные эффекты
        function drawWeatherEffects() {
            if (currentWeather === 'rain') {
                ctx.fillStyle = 'rgba(100, 150, 255, 0.6)';
                for (let i = 0; i < 80; i++) {
                    const rainX = (i * 53 + roadOffset * 4 + Date.now() / 8) % canvas.width;
                    const rainY = (i * 37 + Date.now() / 6) % canvas.height;
                    ctx.fillRect(rainX, rainY, 2, 10);
                    ctx.fillRect(rainX - 1, rainY - 3, 1, 4);
                }
            }
            
            if (currentWeather === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 60; i++) {
                    const snowX = (i * 67 + Date.now() / 12) % canvas.width;
                    const snowY = (i * 43 + Date.now() / 8) % canvas.height;
                    ctx.fillRect(snowX, snowY, 3, 3);
                    ctx.fillRect(snowX + 3, snowY + 3, 2, 2);
                }
            }
            
            if (currentWeather === 'foggy') {
                ctx.fillStyle = 'rgba(200, 200, 200, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
        
        // Главная функция анимации
        function animate() {
            roadOffset = (roadOffset + roadSpeed) % 80;
            backgroundOffset = (backgroundOffset + backgroundSpeed) % 3000;
            
            drawBackground();
            drawRoad();
            
            // Машина - крупно, занимает большую часть экрана
            drawLuxuryCar(100, 100);
            
            // Персонажи - крупно в машине
            drawDetailedCharacter(230, 135, 'kostya', 3);
            drawDetailedCharacter(310, 135, 'dima', 3);
            
            drawWeatherEffects();
            
            requestAnimationFrame(animate);
        }
        
        // Инициализация
        initBackground();
        getEkaterinburgWeather();
        setInterval(getEkaterinburgWeather, 300000);
        animate();
    </script>
</body>
</html>
