<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДИМА И КОСТЯ // ЕДУТ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #050505;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }
        
        #main-container {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            background: #0a0a0a;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #222;
            background: #000;
            z-index: 10;
        }
        
        .title {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
        }
        
        .subtitle {
            font-size: 13px;
            color: #666;
            letter-spacing: 2px;
            margin-top: 8px;
        }
        
        #video-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #050505;
        }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            z-index: 5;
            border: 1px solid #333;
            background: #000;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }
        
        /* Видео скрыто, рендерится через Canvas с хромакеем */
        video {
            display: none;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .text-block {
            font-size: 13px;
            color: #777;
            letter-spacing: 2px;
            text-align: center;
            padding: 10px 20px;
            border: 1px solid #222;
            background: #0a0a0a;
            width: 100%;
            max-width: 900px;
            z-index: 5;
        }
        
        .text-top { margin-bottom: 15px; }
        .text-bottom { margin-top: 15px; }
        
        #weather-info {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            padding: 12px 16px;
            font-size: 11px;
            color: #aaa;
            z-index: 10;
            letter-spacing: 1px;
            line-height: 1.5;
        }
        
        footer {
            padding: 15px;
            text-align: center;
            border-top: 1px solid #222;
            background: #000;
            font-size: 12px;
            color: #555;
            letter-spacing: 2px;
        }

        .blink { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div id="main-container">
        <header>
            <div class="title">ДИМА И КОСТЯ</div>
            <div class="subtitle">// ЕДУТ ПО ЕКАТЕРИНБУРГУ //</div>
        </header>
        
        <div id="video-wrapper">
            <div class="text-block text-top">CHEVROLET IMPALA CONVERTIBLE '64</div>
            
            <div id="video-container">
                <video id="myVideo" autoplay loop muted playsinline crossorigin="anonymous">
                    <source src="animation.mp4" type="video/mp4">
                </video>
                <canvas id="chromaCanvas"></canvas>
                <div id="weather-info">ЗАГРУЗКА...</div>
            </div>
            
            <div class="text-block text-bottom blink">PRESS ANYWHERE TO PLAY AUDIO // VZ</div>
        </div>
        
        <footer>
            <span>VZ // ВОЗМЕЗДИЕ АИДА И КОСТИ</span>
        </footer>
    </div>
    
    <script>
        const video = document.getElementById('myVideo');
        const canvas = document.getElementById('chromaCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const weatherDiv = document.getElementById('weather-info');

        // Вырезаем зелёный хромакей в реальном времени
        function renderChromaKey() {
            if (video.paused || video.ended) {
                requestAnimationFrame(renderChromaKey);
                return;
            }

            if (canvas.width !== video.videoWidth && video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            if (canvas.width > 0) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const l = frame.data.length / 4;

                for (let i = 0; i < l; i++) {
                    let r = frame.data[i * 4 + 0];
                    let g = frame.data[i * 4 + 1];
                    let b = frame.data[i * 4 + 2];

                    // Фильтр для удаление зелёного хромакея
                    if (g > 100 && r < 120 && b < 120 && g > r * 1.2 && g > b * 1.2) {
                        frame.data[i * 4 + 3] = 0; // Полная прозрачность
                    }
                }
                ctx.putImageData(frame, 0, 0);
            }
            requestAnimationFrame(renderChromaKey);
        }

        video.addEventListener('play', () => {
            renderChromaKey();
        });

        // Погода Екатеринбурга
        async function getEkaterinburgWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.8389&longitude=60.6057&current=temperature_2m,weather_code,is_day');
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                const isNight = data.current.is_day === 0;
                
                let weatherText = 'ЯСНО';
                let emoji = '☀️';
                if (weatherCode > 1 && weatherCode <= 3) { weatherText = 'ОБЛАЧНО'; emoji = '☁️'; }
                else if (weatherCode > 3 && weatherCode <= 48) { weatherText = 'ТУМАН'; emoji = '🌫️'; }
                else if (weatherCode > 48 && weatherCode <= 67) { weatherText = 'ДОЖДЬ'; emoji = '🌧️'; }
                else if (weatherCode > 67) { weatherText = 'СНЕГ'; emoji = '❄️'; }
                
                const dayText = isNight ? 'НОЧЬ' : 'ДЕНЬ';
                weatherDiv.innerHTML = `${emoji} ЕКБ: ${temp}°C<br>${weatherText} // ${dayText}`;
            } catch (error) {
                weatherDiv.textContent = 'ЕКБ // WEATHER OFFLINE';
            }
        }

        getEkaterinburgWeather();
        setInterval(getEkaterinburgWeather, 300000);
    </script>
</body>
</html>
