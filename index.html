<!DOCTYPE html>
<html>
<head>
    <title>Дима и Костя едут по Москве</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            font-family: 'Courier New', monospace;
        }
        #container {
            position: relative;
        }
        canvas {
            border: 4px solid #333;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 800px;
            height: 500px;
        }
        #weather-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="gameCanvas" width="400" height="250"></canvas>
        <div id="weather-info">Загружаем погоду...</div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const weatherDiv = document.getElementById('weather-info');
        
        // Отключаем сглаживание для пиксельного вида
        ctx.imageSmoothingEnabled = false;
        
        // Переменные для анимации
        let roadOffset = 0;
        let backgroundOffset = 0;
        const roadSpeed = 3;
        const backgroundSpeed = 1;
        
        // Погода и время
        let currentWeather = 'clear';
        let isNight = false;
        let weatherData = null;
        
        // Массивы для фоновых объектов
        let trees = [];
        let bushes = [];
        let houses = [];
        let clouds = [];
        
        // Инициализация фоновых объектов
        function initBackground() {
            trees = [];
            bushes = [];
            houses = [];
            clouds = [];
            
            for (let i = 0; i < 15; i++) {
                trees.push({
                    x: Math.random() * 2000,
                    type: Math.floor(Math.random() * 3),
                    height: 30 + Math.random() * 40
                });
            }
            
            for (let i = 0; i < 20; i++) {
                bushes.push({
                    x: Math.random() * 2000,
                    type: Math.floor(Math.random() * 2)
                });
            }
            
            for (let i = 0; i < 8; i++) {
                houses.push({
                    x: Math.random() * 2000,
                    width: 40 + Math.random() * 30,
                    height: 30 + Math.random() * 20,
                    color: ['#8B4513', '#A0522D', '#CD853F', '#DEB887'][Math.floor(Math.random() * 4)]
                });
            }
            
            for (let i = 0; i < 10; i++) {
                clouds.push({
                    x: Math.random() * 2000,
                    y: 10 + Math.random() * 40,
                    width: 20 + Math.random() * 30
                });
            }
        }
        
        // Функция для получения погоды в Москве
        async function getMoscowWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current=temperature_2m,weather_code,is_day');
                const data = await response.json();
                weatherData = data;
                
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                isNight = data.current.is_day === 0;
                
                // Определяем тип погоды
                if (weatherCode <= 1) currentWeather = 'clear';
                else if (weatherCode <= 3) currentWeather = 'cloudy';
                else if (weatherCode <= 48) currentWeather = 'foggy';
                else if (weatherCode <= 67) currentWeather = 'rain';
                else if (weatherCode <= 77) currentWeather = 'snow';
                else currentWeather = 'rain';
                
                let weatherText = 'Ясно';
                if (currentWeather === 'cloudy') weatherText = 'Облачно';
                else if (currentWeather === 'foggy') weatherText = 'Туман';
                else if (currentWeather === 'rain') weatherText = 'Дождь';
                else if (currentWeather === 'snow') weatherText = 'Снег';
                
                const dayText = isNight ? 'Ночь' : 'День';
                weatherDiv.textContent = `Москва: ${temp}°C, ${weatherText}, ${dayText}`;
            } catch (error) {
                weatherDiv.textContent = 'Не удалось загрузить погоду';
            }
        }
        
        // Функция для рисования пиксельного персонажа
        function drawDetailedCharacter(x, y, character, scale = 2) {
            const p = scale; // Размер пикселя
            
            // Дима (пассажир)
            if (character === 'dima') {
                // Волосы (тёмно-русые #4A3728)
                ctx.fillStyle = '#4A3728';
                ctx.fillRect(x, y, 10*p, 4*p);
                ctx.fillRect(x - p, y + p, 3*p, 3*p);
                ctx.fillRect(x + 8*p, y + p, 3*p, 3*p);
                
                // Пряди коричневого (#6B4423)
                ctx.fillStyle = '#6B4423';
                ctx.fillRect(x + 2*p, y, 2*p, 2*p);
                ctx.fillRect(x + 6*p, y, 2*p, 2*p);
                
                // Лицо (бледная кожа #F0D5B1)
                ctx.fillStyle = '#F0D5B1';
                ctx.fillRect(x, y + 4*p, 10*p, 8*p);
                
                // Глаза (чёрно-коричневые #2C1810)
                ctx.fillStyle = '#2C1810';
                ctx.fillRect(x + 2*p, y + 6*p, 2*p, 2*p);
                ctx.fillRect(x + 6*p, y + 6*p, 2*p, 2*p);
                
                // Брови
                ctx.fillStyle = '#4A3728';
                ctx.fillRect(x + p, y + 5*p, 3*p, p);
                ctx.fillRect(x + 6*p, y + 5*p, 3*p, p);
                
                // Рот
                ctx.fillStyle = '#C4956A';
                ctx.fillRect(x + 4*p, y + 10*p, 2*p, p);
                
                // Чёрно-белая кофта
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y + 12*p, 10*p, 6*p);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x, y + 12*p, 5*p, 6*p);
                ctx.fillRect(x, y + 14*p, 10*p, 2*p);
            }
            
            // Костя (водитель)
            if (character === 'kostya') {
                // Волосы (ядерно-розовые #FF1493)
                ctx.fillStyle = '#FF1493';
                ctx.fillRect(x, y, 10*p, 4*p);
                ctx.fillRect(x - p, y + p, 3*p, 3*p);
                ctx.fillRect(x + 8*p, y + p, 3*p, 3*p);
                
                // Чёрные пряди
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + p, y, 2*p, 2*p);
                ctx.fillRect(x + 5*p, y + p, 3*p, 2*p);
                
                // Солнцезащитные очки
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(x + p, y + 5*p, 8*p, 3*p);
                ctx.fillStyle = '#333333';
                ctx.fillRect(x + p, y + 5*p, 4*p, 2*p);
                ctx.fillRect(x + 5*p, y + 5*p, 4*p, 2*p);
                
                // Лицо (бледная кожа #F0D5B1)
                ctx.fillStyle = '#F0D5B1';
                ctx.fillRect(x + p, y + 8*p, 8*p, 4*p);
                
                // Рубашка
                ctx.fillStyle = '#4682B4';
                ctx.fillRect(x, y + 12*p, 10*p, 6*p);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x + 4*p, y + 12*p, 2*p, 6*p); // Пуговицы
            }
        }
        
        // Функция для рисования машины (зелёная, направлена влево)
        function drawCar(x, y) {
            // Кузов (зелёный)
            ctx.fillStyle = '#228B22';
            ctx.fillRect(x, y, 80, 20);
            
            // Крыша
            ctx.fillRect(x + 20, y - 15, 40, 15);
            
            // Капот (передняя часть)
            ctx.fillRect(x - 10, y + 5, 10, 10);
            
            // Багажник
            ctx.fillRect(x + 80, y + 5, 10, 10);
            
            // Окна
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(x + 25, y - 12, 15, 10); // Водительское окно
            ctx.fillRect(x + 45, y - 12, 15, 10); // Пассажирское окно
            
            // Фары (направлены влево)
            ctx.fillStyle = '#FFFF00';
            ctx.fillRect(x - 15, y + 3, 5, 8);
            
            // Задние фонари
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(x + 90, y + 3, 5, 8);
            
            // Колёса
            ctx.fillStyle = '#000000';
            ctx.fillRect(x - 5, y + 20, 15, 15);
            ctx.fillRect(x + 70, y + 20, 15, 15);
            
            // Колёсные диски
            ctx.fillStyle = '#808080';
            ctx.fillRect(x, y + 25, 5, 5);
            ctx.fillRect(x + 75, y + 25, 5, 5);
            
            // Руль (виден через окно)
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + 28, y - 8, 8, 2);
        }
        
        // Функция для рисования фона
        function drawBackground() {
            // Небо (меняется в зависимости от погоды и времени)
            if (isNight) {
                ctx.fillStyle = '#0a0a2e';
            } else if (currentWeather === 'cloudy' || currentWeather === 'rain') {
                ctx.fillStyle = '#808080';
            } else if (currentWeather === 'foggy') {
                ctx.fillStyle = '#A9A9A9';
            } else {
                ctx.fillStyle = '#87CEEB';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Облака (если не ночь)
            if (!isNight && currentWeather !== 'rain') {
                clouds.forEach(cloud => {
                    const cloudX = cloud.x - backgroundOffset;
                    if (cloudX > -50 && cloudX < canvas.width + 50) {
                        ctx.fillStyle = currentWeather === 'cloudy' ? '#696969' : '#FFFFFF';
                        ctx.fillRect(cloudX, cloud.y, cloud.width, 10);
                        ctx.fillRect(cloudX + 5, cloud.y - 5, cloud.width - 10, 5);
                    }
                });
            }
            
            // Дома
            houses.forEach(house => {
                const houseX = house.x - backgroundOffset;
                if (houseX > -100 && houseX < canvas.width + 100) {
                    ctx.fillStyle = house.color;
                    ctx.fillRect(houseX, 150 - house.height, house.width, house.height);
                    
                    // Крыша
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(houseX - 5, 150 - house.height - 10, house.width + 10, 10);
                    
                    // Окна
                    ctx.fillStyle = '#FFFF00';
                    for (let i = 0; i < 3; i++) {
                        ctx.fillRect(houseX + 5 + i * 12, 150 - house.height + 5, 8, 8);
                    }
                }
            });
            
            // Деревья
            trees.forEach(tree => {
                const treeX = tree.x - backgroundOffset;
                if (treeX > -50 && treeX < canvas.width + 50) {
                    // Ствол
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(treeX + 5, 150 - tree.height + 20, 10, tree.height - 20);
                    
                    // Крона
                    ctx.fillStyle = tree.type === 0 ? '#228B22' : tree.type === 1 ? '#006400' : '#32CD32';
                    ctx.fillRect(treeX, 150 - tree.height, 20, tree.height - 20);
                    ctx.fillRect(treeX + 5, 150 - tree.height - 10, 10, 10);
                }
            });
            
            // Кусты
            bushes.forEach(bush => {
                const bushX = bush.x - backgroundOffset;
                if (bushX > -30 && bushX < canvas.width + 30) {
                    ctx.fillStyle = bush.type === 0 ? '#006400' : '#228B22';
                    ctx.fillRect(bushX, 145, 20, 5);
                    ctx.fillRect(bushX + 3, 140, 14, 5);
                }
            });
            
            // Земля
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, 150, canvas.width, 20);
        }
        
        // Функция для рисования дороги
        function drawRoad() {
            // Дорога
            ctx.fillStyle = '#4a4a4a';
            ctx.fillRect(0, 170, canvas.width, 80);
            
            // Дорожная разметка (движется)
            ctx.fillStyle = '#FFFFFF';
            for (let i = -1; i < 8; i++) {
                const markingX = (i * 60) - roadOffset;
                if (markingX > -60 && markingX < canvas.width + 60) {
                    ctx.fillRect(markingX, 207, 30, 4);
                }
            }
            
            // Бордюры
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 168, canvas.width, 2);
            ctx.fillRect(0, 248, canvas.width, 2);
        }
        
        // Функция для рисования дождя
        function drawRain() {
            ctx.fillStyle = 'rgba(100, 100, 200, 0.5)';
            for (let i = 0; i < 50; i++) {
                const rainX = (i * 37 + roadOffset * 3) % canvas.width;
                const rainY = (i * 23 + Date.now() / 10) % canvas.height;
                ctx.fillRect(rainX, rainY, 2, 8);
            }
        }
        
        // Функция для рисования снега
        function drawSnow() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (let i = 0; i < 40; i++) {
                const snowX = (i * 41 + roadOffset * 2) % canvas.width;
                const snowY = (i * 29 + Date.now() / 20) % canvas.height;
                ctx.fillRect(snowX, snowY, 3, 3);
            }
        }
        
        // Функция для рисования тумана
        function drawFog() {
            ctx.fillStyle = 'rgba(200, 200, 200, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // Главная функция анимации
        function animate() {
            // Обновляем смещения
            roadOffset = (roadOffset + roadSpeed) % 60;
            backgroundOffset = (backgroundOffset + backgroundSpeed) % 2000;
            
            // Рисуем фон
            drawBackground();
            
            // Рисуем дорогу
            drawRoad();
            
            // Рисуем машину (фиксированная позиция)
            drawCar(140, 140);
            
            // Рисуем персонажей
            drawDetailedCharacter(165, 120, 'kostya', 2); // Костя за рулём
            drawDetailedCharacter(185, 120, 'dima', 2); // Дима на пассажирском
            
            // Погодные эффекты
            if (currentWeather === 'rain') drawRain();
            if (currentWeather === 'snow') drawSnow();
            if (currentWeather === 'foggy') drawFog();
            
            // Запускаем следующий кадр
            requestAnimationFrame(animate);
        }
        
        // Инициализация
        initBackground();
        getMoscowWeather();
        
        // Обновляем погоду каждые 5 минут
        setInterval(getMoscowWeather, 300000);
        
        // Запускаем анимацию
        animate();
    </script>
</body>
</html>
