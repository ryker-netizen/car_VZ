<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДИМА И КОСТЯ // ЕДУТ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }
        
        #main-container {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            background: #111;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .subtitle {
            font-size: 14px;
            color: #888;
            letter-spacing: 3px;
            margin-top: 10px;
        }
        
        #video-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            border: 2px solid #333;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        
        video {
            display: none;
        }
        
        .text-block {
            font-size: 14px;
            color: #888;
            letter-spacing: 3px;
            text-align: center;
            padding: 10px 20px;
            border: 1px solid #333;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
        }
        
        .text-top {
            margin-bottom: 20px;
        }
        
        .text-bottom {
            margin-top: 20px;
        }
        
        #weather-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 15px;
            font-size: 12px;
            color: #ccc;
            z-index: 10;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        
        footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            color: #888;
            letter-spacing: 3px;
        }
        
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid #444;
            z-index: 5;
        }
        
        .corner-tl {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        
        .corner-tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }
        
        .corner-bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }
        
        .corner-br {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .blink {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <header>
            <div class="title">ДИМА И КОСТЯ</div>
            <div class="subtitle">// ЕДУТ ПО ЕКАТЕРИНБУРГУ //</div>
        </header>
        
        <div id="video-wrapper">
            <div class="text-block text-top">СВЕРХУ</div>
            
            <div id="video-container">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                
                <canvas id="outputCanvas"></canvas>
                <video id="sourceVideo" autoplay loop muted playsinline>
                    <source src="animation.mp4" type="video/mp4">
                </video>
                
                <div id="weather-info">ЗАГРУЗКА...</div>
            </div>
            
            <div class="text-block text-bottom blink">СНИЗУ</div>
        </div>
        
        <footer>
            <span>VZ // ВОЗМЕЗДИЕ АИДА И КОСТИ</span>
        </footer>
    </div>
    
    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const weatherDiv = document.getElementById('weather-info');
        
        let isNight = false;
        let currentWeather = 'clear';
        
        // Убираем белый фон
        function processVideoFrame() {
            if (video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Убираем белые пиксели
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    // Белый фон -> прозрачный
                    if (r > 240 && g > 240 && b > 240) {
                        data[i + 3] = 0;
                    }
                    // Почти белый -> полупрозрачный
                    else if (r > 220 && g > 220 && b > 220) {
                        data[i + 3] = 64;
                    }
                    // Светлый -> ещё прозрачнее
                    else if (r > 200 && g > 200 && b > 200) {
                        data[i + 3] = 128;
                    }
                }
                
                ctx.putImageData(imageData, 0, 0);
            }
            
            requestAnimationFrame(processVideoFrame);
        }
        
        // Инициализация canvas когда видео загрузится
        video.addEventListener('loadeddata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            processVideoFrame();
        });
        
        // Идеальный loop с плавным переходом
        function setupPerfectLoop() {
            // Плавное затухание перед концом
            video.addEventListener('timeupdate', () => {
                const timeToEnd = video.duration - video.currentTime;
                
                // Затухание за 0.2 секунды до конца
                if (timeToEnd <= 0.2) {
                    const opacity = (timeToEnd / 0.2) * 0.8;
                    video.style.opacity = Math.max(0, opacity);
                } else {
                    video.style.opacity = '1';
                }
                
                // Переход в начало
                if (timeToEnd <= 0.03) {
                    video.currentTime = 0.03;
                    video.play();
                    
                    // Плавное появление
                    setTimeout(() => {
                        video.style.opacity = '1';
                    }, 100);
                }
            });
            
            // Страховка если видео остановилось
            video.addEventListener('ended', () => {
                video.currentTime = 0;
                video.play();
            });
            
            // Дополнительная проверка каждые 100мс
            setInterval(() => {
                if (video.ended || video.currentTime >= video.duration - 0.05) {
                    video.currentTime = 0;
                    video.play();
                }
            }, 100);
        }
        
        setupPerfectLoop();
        
        // Получение погоды Екатеринбурга
        async function getEkaterinburgWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.8389&longitude=60.6057&current=temperature_2m,weather_code,is_day');
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                isNight = data.current.is_day === 0;
                
                if (weatherCode <= 1) currentWeather = 'clear';
                else if (weatherCode <= 3) currentWeather = 'cloudy';
                else if (weatherCode <= 48) currentWeather = 'foggy';
                else if (weatherCode <= 67) currentWeather = 'rain';
                else if (weatherCode <= 77) currentWeather = 'snow';
                else currentWeather = 'rain';
                
                let weatherText = 'ЯСНО';
                let emoji = '☀️';
                if (currentWeather === 'cloudy') { weatherText = 'ОБЛАЧНО'; emoji = '☁️'; }
                else if (currentWeather === 'foggy') { weatherText = 'ТУМАН'; emoji = '🌫️'; }
                else if (currentWeather === 'rain') { weatherText = 'ДОЖДЬ'; emoji = '🌧️'; }
                else if (currentWeather === 'snow') { weatherText = 'СНЕГ'; emoji = '❄️'; }
                
                const dayText = isNight ? 'НОЧЬ' : 'ДЕНЬ';
                weatherDiv.innerHTML = `${emoji} ЕКБ: ${temp}°C<br>${weatherText} // ${dayText}`;
                
                const wrapper = document.getElementById('video-wrapper');
                const container = document.getElementById('video-container');
                
                if (isNight) {
                    wrapper.style.background = 'linear-gradient(to bottom, #0a0a1a, #1a1a2a)';
                    container.style.background = '#0a0a2e';
                } else if (currentWeather === 'rain') {
                    wrapper.style.background = 'linear-gradient(to bottom, #1a1a1a, #2a2a2a)';
                    container.style.background = '#1a1a2a';
                } else if (currentWeather === 'snow') {
                    wrapper.style.background = 'linear-gradient(to bottom, #2a2a2a, #3a3a3a)';
                    container.style.background = '#2a2a3a';
                } else if (currentWeather === 'cloudy') {
                    wrapper.style.background = 'linear-gradient(to bottom, #1a1a1a, #222)';
                    container.style.background = '#1a1a1a';
                } else {
                    wrapper.style.background = 'linear-gradient(to bottom, #1a1a1a, #0a0a0a)';
                    container.style.background = '#0a0a0a';
                }
                
            } catch (error) {
                weatherDiv.textContent = 'ЕКБ // -5°C';
            }
        }
        
        getEkaterinburgWeather();
        setInterval(getEkaterinburgWeather, 300000);
    </script>
</body>
</html>
