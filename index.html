<!DOCTYPE html>
<html>
<head>
    <title>Дима и Костя едут по Екатеринбургу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: background 2s;
        }
        
        #video-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 800px;
            z-index: 10;
        }
        
        video {
            width: 100%;
            height: auto;
            mix-blend-mode: screen;
            -webkit-mix-blend-mode: screen;
        }
        
        #weather-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            z-index: 20;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 20;
            letter-spacing: 2px;
        }
        
        /* Дорожная разметка */
        .road-line {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40%;
            background: repeating-linear-gradient(
                90deg,
                #555 0px,
                #555 50px,
                transparent 50px,
                transparent 80px
            );
            opacity: 0.6;
            z-index: 5;
        }
        
        /* Дорога */
        #road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, #4a4a4a 0%, #333 100%);
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="background"></div>
        <div id="road"></div>
        
        <div id="title">ДИМА И КОСТЯ</div>
        <div id="weather-info">Загружаем погоду...</div>
        
        <div id="video-container">
            <video autoplay loop muted playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    
    <script>
        const background = document.getElementById('background');
        const weatherDiv = document.getElementById('weather-info');
        const road = document.getElementById('road');
        
        let isNight = false;
        let currentWeather = 'clear';
        
        // Получение погоды Екатеринбурга
        async function getEkaterinburgWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.8389&longitude=60.6057&current=temperature_2m,weather_code,is_day');
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                isNight = data.current.is_day === 0;
                
                // Определяем тип погоды
                if (weatherCode <= 1) currentWeather = 'clear';
                else if (weatherCode <= 3) currentWeather = 'cloudy';
                else if (weatherCode <= 48) currentWeather = 'foggy';
                else if (weatherCode <= 67) currentWeather = 'rain';
                else if (weatherCode <= 77) currentWeather = 'snow';
                else currentWeather = 'rain';
                
                // Обновляем фон
                updateBackground();
                
                // Обновляем текст
                let weatherText = 'Ясно';
                let emoji = '☀️';
                if (currentWeather === 'cloudy') { weatherText = 'Облачно'; emoji = '☁️'; }
                else if (currentWeather === 'foggy') { weatherText = 'Туман'; emoji = '🌫️'; }
                else if (currentWeather === 'rain') { weatherText = 'Дождь'; emoji = '🌧️'; }
                else if (currentWeather === 'snow') { weatherText = 'Снег'; emoji = '❄️'; }
                
                const dayText = isNight ? '🌙 Ночь' : '☀️ День';
                weatherDiv.innerHTML = `${emoji} Екатеринбург: ${temp}°C<br>${weatherText}, ${dayText}`;
                
            } catch (error) {
                weatherDiv.textContent = 'Екатеринбург';
                updateBackground();
            }
        }
        
        function updateBackground() {
            let gradient;
            
            if (isNight) {
                // Ночное небо
                if (currentWeather === 'rain') {
                    gradient = 'linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 50%, #2a2a4a 100%)';
                } else if (currentWeather === 'snow') {
                    gradient = 'linear-gradient(to bottom, #1a1a2e 0%, #2a2a3e 50%, #3a3a4e 100%)';
                } else if (currentWeather === 'cloudy') {
                    gradient = 'linear-gradient(to bottom, #0a0a0a 0%, #1a1a2a 50%, #2a2a3a 100%)';
                } else {
                    gradient = 'linear-gradient(to bottom, #0a0a2e 0%, #1a1a4a 50%, #2a2a5a 100%)';
                }
            } else {
                // Дневное небо
                if (currentWeather === 'rain') {
                    gradient = 'linear-gradient(to bottom, #4a4a5a 0%, #6a6a7a 50%, #8a8a9a 100%)';
                } else if (currentWeather === 'snow') {
                    gradient = 'linear-gradient(to bottom, #8a8a9a 0%, #aaaaaa 50%, #cccccc 100%)';
                } else if (currentWeather === 'foggy') {
                    gradient = 'linear-gradient(to bottom, #9a9a9a 0%, #b0b0b0 50%, #c0c0c0 100%)';
                } else if (currentWeather === 'cloudy') {
                    gradient = 'linear-gradient(to bottom, #6a6a7a 0%, #8a8a9a 50%, #aaaaaa 100%)';
                } else {
                    gradient = 'linear-gradient(to bottom, #4a90e2 0%, #87CEEB 50%, #b0d4f1 100%)';
                }
            }
            
            background.style.background = gradient;
            
            // Обновляем дорогу
            if (currentWeather === 'snow') {
                road.style.background = 'linear-gradient(to bottom, #e0e0e0 0%, #c0c0c0 100%)';
            } else if (currentWeather === 'rain') {
                road.style.background = 'linear-gradient(to bottom, #2a2a2a 0%, #1a1a1a 100%)';
            } else if (isNight) {
                road.style.background = 'linear-gradient(to bottom, #3a3a3a 0%, #2a2a2a 100%)';
            } else {
                road.style.background = 'linear-gradient(to bottom, #5a5a5a 0%, #4a4a4a 100%)';
            }
        }
        
        // Создаём звёзды для ночного неба
        function createStars() {
            const starsContainer = document.createElement('div');
            starsContainer.id = 'stars';
            starsContainer.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;';
            
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.style.cssText = `
                    position: absolute;
                    top: ${Math.random() * 100}%;
                    left: ${Math.random() * 100}%;
                    width: ${Math.random() * 3 + 1}px;
                    height: ${Math.random() * 3 + 1}px;
                    background: white;
                    border-radius: 50%;
                    animation: twinkle ${Math.random() * 3 + 1}s infinite;
                `;
                starsContainer.appendChild(star);
            }
            
            document.getElementById('container').appendChild(starsContainer);
        }
        
        // Добавляем анимацию мерцания звёзд
        const style = document.createElement('style');
        style.textContent = `
            @keyframes twinkle {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.3; }
            }
        `;
        document.head.appendChild(style);
        
        // Инициализация
        createStars();
        getEkaterinburgWeather();
        
        // Обновляем погоду каждые 5 минут
        setInterval(getEkaterinburgWeather, 300000);

const video = document.querySelector('video');

// Гарантированный идеальный loop
video.addEventListener('timeupdate', () => {
    if (video.currentTime >= video.duration - 0.04) {
        video.currentTime = 0.04;
        video.play();
    }
});
        
    </script>
</body>
</html>
