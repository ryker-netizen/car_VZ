<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДИМА И КОСТЯ // ЕДУТ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }
        
        #main-container {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            background: #111;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        /* Шапка */
        header {
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .subtitle {
            font-size: 14px;
            color: #888;
            letter-spacing: 3px;
            margin-top: 10px;
        }
        
        /* Контейнер для видео */
        #video-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            border: 2px solid #333;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
            mix-blend-mode: screen;
            -webkit-mix-blend-mode: screen;
        }
        
        /* Текст вокруг видео */
        .text-top {
            font-size: 12px;
            color: #666;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .text-bottom {
            font-size: 12px;
            color: #666;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 20px;
        }
        
        /* Погода */
        #weather-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 15px;
            font-size: 12px;
            color: #ccc;
            z-index: 10;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }
        
        /* Нижняя часть */
        footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
            font-size: 11px;
            color: #555;
            letter-spacing: 2px;
        }
        
        /* Декоративные элементы */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid #444;
        }
        
        .corner-tl {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        
        .corner-tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }
        
        .corner-bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }
        
        .corner-br {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }
        
        /* Анимация */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .blink {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <header>
            <div class="title">ДИМА И КОСТЯ</div>
            <div class="subtitle">// ЕДУТ ПО ЕКАТЕРИНБУРГУ //</div>
        </header>
        
        <div id="video-wrapper">
            <div class="text-top">— ЗАГРУЗКА РЕАЛЬНОСТИ —</div>
            
            <div id="video-container">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                
                <video autoplay loop muted playsinline>
                    <source src="video.mp4" type="video/mp4">
                </video>
                
                <div id="weather-info">ЗАГРУЗКА...</div>
            </div>
            
            <div class="text-bottom blink">— [ СВЯЗЬ УСТАНОВЛЕНА ] —</div>
        </div>
        
        <footer>
            <span>© 2024 // ВСЕ ПРАВА ЗАЩИЩЕНЫ // ЕКАТЕРИНБУРГ</span>
        </footer>
    </div>
    
    <script>
        const weatherDiv = document.getElementById('weather-info');
        let isNight = false;
        let currentWeather = 'clear';
        
        // Получение погоды Екатеринбурга
        async function getEkaterinburgWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=56.8389&longitude=60.6057&current=temperature_2m,weather_code,is_day');
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                isNight = data.current.is_day === 0;
                
                if (weatherCode <= 1) currentWeather = 'clear';
                else if (weatherCode <= 3) currentWeather = 'cloudy';
                else if (weatherCode <= 48) currentWeather = 'foggy';
                else if (weatherCode <= 67) currentWeather = 'rain';
                else if (weatherCode <= 77) currentWeather = 'snow';
                else currentWeather = 'rain';
                
                let weatherText = 'ЯСНО';
                let emoji = '☀️';
                if (currentWeather === 'cloudy') { weatherText = 'ОБЛАЧНО'; emoji = '☁️'; }
                else if (currentWeather === 'foggy') { weatherText = 'ТУМАН'; emoji = '🌫️'; }
                else if (currentWeather === 'rain') { weatherText = 'ДОЖДЬ'; emoji = '🌧️'; }
                else if (currentWeather === 'snow') { weatherText = 'СНЕГ'; emoji = '❄️'; }
                
                const dayText = isNight ? 'НОЧЬ' : 'ДЕНЬ';
                weatherDiv.innerHTML = `${emoji} ЕКБ: ${temp}°C<br>${weatherText} // ${dayText}`;
                
                // Обновляем фон в зависимости от времени
                const wrapper = document.getElementById('video-wrapper');
                if (isNight) {
                    wrapper.style.background = 'linear-gradient(to bottom, #0a0a1a, #1a1a2a)';
                } else if (currentWeather === 'rain') {
                    wrapper.style.background = 'linear-gradient(to bottom, #1a1a1a, #2a2a2a)';
                } else {
                    wrapper.style.background = 'linear-gradient(to bottom, #1a1a1a, #0a0a0a)';
                }
                
            } catch (error) {
                weatherDiv.textContent = 'ЕКБ // -5°C';
            }
        }
        
        getEkaterinburgWeather();
        setInterval(getEkaterinburgWeather, 300000);
    </script>
</body>
</html>
